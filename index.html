<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김현승의 서재 | 작은 기록들이 머무는 공간</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-paper: #f7f5f0;
      --bg-card: #fdfcf9;
      --bg-drawer: #ffffff;
      --text-main: #22201e;
      --text-sub: #5c5751;
      --text-muted: #8c857d;
      --accent: #4a5d4e;
      --accent-soft: #eef2ef;
      --ebook-accent: #3b4f6b;
      --ebook-soft: #eef2f7;
      --border: #e5e0d8;
      --shelf-wood: #dfd8cc;
      --shelf-shadow: rgba(34, 32, 30, 0.08);
      --serif: "Noto Serif KR", Georgia, serif;
      --sans: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      padding: 64px 0 40px;
      text-align: center;
    }

    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    header h1 {
      font-family: var(--serif);
      font-size: clamp(1.7rem, 3.5vw, 2.3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    header p.subtitle {
      font-size: 0.96rem;
      color: var(--text-sub);
      font-weight: 300;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Bookshelf Section */
    main {
      flex: 1;
      padding: 16px 0 72px;
    }

    .shelf-wrapper {
      position: relative;
      padding: 28px 16px 0;
    }

    .books-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 32px;
      align-items: end;
      padding: 0 16px 24px;
    }

    .book-card {
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      outline: none;
    }

    .book-card:hover,
    .book-card:focus-visible {
      transform: translateY(-10px);
    }

    .book-cover-wrap {
      position: relative;
      width: 100%;
      max-width: 200px;
      aspect-ratio: 1 / 1.46;
      border-radius: 3px 8px 8px 3px;
      overflow: hidden;
      background: #eae5dc;
      box-shadow:
        -6px 8px 18px rgba(0, 0, 0, 0.14),
        -2px 0 4px rgba(0, 0, 0, 0.08),
        inset 3px 0 6px rgba(255, 255, 255, 0.35);
      margin-bottom: 18px;
      transition: box-shadow 0.28s ease;
    }

    .book-card:hover .book-cover-wrap {
      box-shadow:
        -10px 16px 28px rgba(0, 0, 0, 0.18),
        -2px 0 4px rgba(0, 0, 0, 0.1);
    }

    .book-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .book-cover-fallback {
      width: 100%;
      height: 100%;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      background: linear-gradient(145deg, #f3efe6 0%, #e4ddd0 100%);
      border-left: 6px solid #c9c0b1;
    }

    .book-cover-fallback .fallback-title {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-main);
    }

    .book-cover-fallback .fallback-author {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .book-meta {
      max-width: 220px;
    }

    .book-title {
      font-family: var(--serif);
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .book-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .book-card:hover .book-hint {
      color: var(--accent);
    }

    .shelf-plank {
      height: 14px;
      background: linear-gradient(180deg, #e7e1d6 0%, var(--shelf-wood) 100%);
      border-radius: 3px;
      box-shadow: 0 10px 20px var(--shelf-shadow);
      border-top: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* Footer */
    footer {
      padding: 28px 0 40px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
    }

    footer a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Drawer Overlay & Panel */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(25, 23, 20, 0.42);
      backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 90;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 580px;
      height: 100vh;
      background: var(--bg-drawer);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.14);
      transform: translateX(100%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .drawer-label {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .drawer-close {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text-sub);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .drawer-close:hover {
      background: var(--bg-paper);
      color: var(--text-main);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 28px 28px 48px;
    }

    .drawer-hero {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 26px;
    }

    .drawer-cover {
      width: 112px;
      flex-shrink: 0;
      aspect-ratio: 1 / 1.46;
      border-radius: 3px 6px 6px 3px;
      overflow: hidden;
      background: #eae5dc;
      box-shadow: -4px 6px 14px rgba(0, 0, 0, 0.12);
    }

    .drawer-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .drawer-info {
      flex: 1;
      min-width: 0;
    }

    .drawer-info h2 {
      font-family: var(--serif);
      font-size: 1.34rem;
      font-weight: 600;
      line-height: 1.38;
      margin-bottom: 6px;
      word-break: keep-all;
    }

    .drawer-author {
      font-size: 0.86rem;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    /* Store Format Groups (Paper / E-book) */
    .store-groups {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .store-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .format-badge {
      font-size: 0.73rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .format-badge.paper {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .format-badge.ebook {
      background: var(--ebook-soft);
      color: var(--ebook-accent);
    }

    .store-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.18s ease;
    }

    .store-link-btn.paper:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .store-link-btn.ebook:hover {
      background: var(--ebook-accent);
      border-color: var(--ebook-accent);
      color: #ffffff;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 12px;
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* Section Headings inside Drawer */
    .section-title {
      font-family: var(--serif);
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Book Summary */
    .book-summary {
      font-size: 0.93rem;
      color: var(--text-sub);
      line-height: 1.85;
      white-space: pre-line;
      word-break: keep-all;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 28px;
    }

    /* Structured TOC */
    .toc-list {
      list-style: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }

    .toc-item {
      font-size: 0.88rem;
      color: var(--text-sub);
      padding: 7px 0;
      border-bottom: 1px dashed rgba(229, 224, 216, 0.7);
      line-height: 1.5;
      word-break: keep-all;
    }

    .toc-item:last-child {
      border-bottom: none;
    }

    .toc-item.toc-part {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 0.94rem;
      color: var(--accent);
      margin-top: 14px;
      padding: 8px 10px;
      background: var(--accent-soft);
      border-radius: 5px;
      border-bottom: none;
    }

    .toc-item.toc-part:first-child {
      margin-top: 0;
    }

    .toc-item.toc-sub {
      padding-left: 10px;
    }

    /* Excerpts */
    .excerpt-card {
      background: var(--bg-card);
      border-left: 3px solid var(--accent);
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      border-radius: 0 8px 8px 0;
      padding: 18px 20px;
      margin-bottom: 14px;
      font-family: var(--serif);
      font-size: 0.96rem;
      line-height: 1.8;
      color: var(--text-main);
      word-break: keep-all;
    }

    /* Reviews & Press */
    .feed-group {
      margin-bottom: 26px;
    }

    .feed-card {
      display: block;
      text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px 18px;
      margin-bottom: 10px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .feed-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .feed-card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.45;
    }

    .feed-card-snippet {
      font-size: 0.83rem;
      color: var(--text-sub);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .feed-card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .empty-state {
      font-size: 0.86rem;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    @media (max-width: 720px) {
      header {
        padding: 44px 0 28px;
      }

      .books-row {
        grid-template-columns: 1fr;
        gap: 36px;
      }

      .shelf-plank {
        display: none;
      }

      .drawer {
        max-width: 100%;
      }

      .drawer-body {
        padding: 22px 20px 44px;
      }
    }
  </style>
</head>

    <div class="container">

      <h1>김현승의 서재</h1>
      <p class="subtitle">
        멈춤과 침묵, 그리고 하루의 결을 기록한 세 권의 책입니다. 표지를 누르면 책 소개와 목차, 독자 리뷰를 살펴보실 수 있습니다.

  </header>

  <main>

        <button class="tab-btn" type="button" data-tab="media">리뷰 &amp; 언론</button>
      </div>

      <div id="tab-intro" class="tab-panel active">
        <h3 class="section-title">도서 소개</h3>
        <div id="drawerSummary" class="book-summary"></div>

        <h3 class="section-title">목차</h3>
        <ul id="drawerToc" class="toc-list"></ul>
      </div>

      <div id="tab-excerpts" class="tab-panel">
        <h3 class="section-title">책 속의 문장</h3>
        <div id="drawerExcerpts"></div>
      </div>

      <div id="tab-media" class="tab-panel">
        <div class="feed-group">
          <h3 class="section-title">네이버 블로그 리뷰</h3>
          <div id="drawerReviews"></div>
        </div>
        <div class="feed-group">
          <h3 class="section-title">언론 보도</h3>
          <div id="drawerPress"></div>
        </div>
      </div>
    </div>
  </aside>

          },
          cover_url: "https://file.bookk.co.kr/books/migrations/files/2020/10/06/b99c8e41c9af4fb9d3f42f56cddec4c3.JPG",
          summary: "이 책을 통해 다른 사람이 행복한 하루가 아닌 당신의 하루가 행복할 수 있기를 바랍니다.",
          toc: ["#프롤로그 … 12"],
          excerpts: ["조용한 기록은 시간이 흐를수록 선명한 지도가 된다."],
          reviews: [],
          press: []
        }
      ]
    };

    let booksState = [];

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isPartHeading(line) {
      const trimmed = line.trim();
      return (
        trimmed.startsWith("#프롤로그") ||
        trimmed.startsWith("#에필로그") ||
        trimmed.startsWith("#") ||
        trimmed.startsWith("[제") ||
        /^Part\s*\d+/i.test(trimmed) ||
        trimmed === "「차례」"
      );
    }

    function renderStoreGroups(book) {
      const container = document.getElementById("drawerStoreGroups");
      const stores = book.stores || {};

      let paperList = Array.isArray(stores.paper)
        ? stores.paper.filter((s) => s && s.name && s.url)
        : [];
      let ebookList = Array.isArray(stores.ebook)
        ? stores.ebook.filter((s) => s && s.name && s.url)
        : [];

      if (paperList.length === 0 && book.bookk_url) {
        paperList = [{ name: "부크크", url: book.bookk_url }];
      }

      const rows = [];

      if (paperList.length > 0) {
        const linksHtml = paperList
          .map(
            (s) =>
              `<a class="store-link-btn paper" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.name)} ↗</a>`
          )
          .join("");
        rows.push(`
          <div class="store-row">
            <span class="format-badge paper">종이책</span>
            ${linksHtml}
          </div>
        `);
      }

      if (ebookList.length > 0) {
        const linksHtml = ebookList
          .map(
            (s) =>
              `<a class="store-link-btn ebook" href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.name)} ↗</a>`
          )
          .join("");
        rows.push(`
          <div class="store-row">
            <span class="format-badge ebook">전자책</span>
            ${linksHtml}
          </div>
        `);
      }

      container.innerHTML = rows.join("");
    }

    function renderShelf(books) {
      const row = document.getElementById("booksRow");
      row.innerHTML = books
        .map((book, idx) => {
          const coverHtml = book.cover_url
            ? `<img src="${escapeHtml(book.cover_url)}" alt="${escapeHtml(book.title)} 표지" loading="lazy" />`
            : `<div class="book-cover-fallback">
                <div class="fallback-title">${escapeHtml(book.title)}</div>
                <div class="fallback-author">${escapeHtml(book.author)}</div>
              </div>`;

          return `
            <button class="book-card" type="button" data-index="${idx}">
              <div class="book-cover-wrap">${coverHtml}</div>
              <div class="book-meta">
                <div class="book-title">${escapeHtml(book.title)}</div>
                <div class="book-hint">책 펼치기 →</div>
              </div>
            </button>
          `;
        })
        .join("");

      row.querySelectorAll(".book-card").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-index"));
          openDrawer(booksState[idx]);
        });
      });
    }

    function renderFeedList(containerId, items, emptyMessage) {
      const el = document.getElementById(containerId);
      if (!items || items.length === 0) {
        el.innerHTML = `<div class="empty-state">${escapeHtml(emptyMessage)}</div>`;
        return;
      }

      el.innerHTML = items
        .map(
          (item) => `
          <a class="feed-card" href="${escapeHtml(item.link)}" target="_blank" rel="noopener noreferrer">
            <div class="feed-card-title">${escapeHtml(item.title)}</div>
            ${item.snippet ? `<div class="feed-card-snippet">${escapeHtml(item.snippet)}</div>` : ""}
            <div class="feed-card-meta">
              <span>${escapeHtml(item.blogger || "")}</span>
              <span>${escapeHtml(item.date || "")}</span>
            </div>
          </a>
        `
        )
        .join("");
    }

    function openDrawer(book) {
      if (!book) return;

      document.getElementById("drawerBookTitle").textContent = book.title;
      document.getElementById("drawerBookAuthor").textContent = `${book.author} 지음 · ${book.publisher || "부크크(bookk)"}`;
      renderStoreGroups(book);

      const coverEl = document.getElementById("drawerCover");
      coverEl.innerHTML = book.cover_url
        ? `<img src="${escapeHtml(book.cover_url)}" alt="${escapeHtml(book.title)} 표지" />`
        : `<div class="book-cover-fallback"><div class="fallback-title">${escapeHtml(book.title)}</div></div>`;

      document.getElementById("drawerSummary").textContent = book.summary || "도서 소개가 준비 중입니다.";

      const tocEl = document.getElementById("drawerToc");
      if (book.toc && book.toc.length > 0) {
        tocEl.innerHTML = book.toc
          .map((line) => {
            const part = isPartHeading(line);
            const cls = part ? "toc-item toc-part" : "toc-item toc-sub";
            return `<li class="${cls}">${escapeHtml(line)}</li>`;
          })
          .join("");
      } else {
        tocEl.innerHTML = `<li class="toc-item">목차 정보가 등록되지 않았습니다.</li>`;
      }

      const excerptsEl = document.getElementById("drawerExcerpts");
      if (book.excerpts && book.excerpts.length > 0) {
        excerptsEl.innerHTML = book.excerpts
          .map((quote) => `<blockquote class="excerpt-card">“${escapeHtml(quote)}”</blockquote>`)
          .join("");
      } else {
        excerptsEl.innerHTML = `<div class="empty-state">발췌 문장이 곧 추가될 예정입니다.</div>`;
      }

      renderFeedList("drawerReviews", book.reviews, "아직 수집된 네이버 블로그 리뷰가 없습니다.");
      renderFeedList("drawerPress", book.press, "아직 수집된 언론 보도가 없습니다.");

      setActiveTab("intro");

      document.getElementById("drawerBackdrop").classList.add("open");
      const drawer = document.getElementById("bookDrawer");
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeDrawer() {
      document.getElementById("drawerBackdrop").classList.remove("open");
      const drawer = document.getElementById("bookDrawer");
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function setActiveTab(tabName) {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tabName);
      });
      document.querySelectorAll(".tab-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `tab-${tabName}`);
      });
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        setActiveTab(btn.getAttribute("data-tab"));
      });
    });

    document.getElementById("drawerCloseBtn").addEventListener("click", closeDrawer);
    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDrawer();
    });

    async function init() {
      try {
        const res = await fetch(`./data/books_data.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Failed to load books_data.json");
        const data = await res.json();
        booksState = data.books && data.books.length ? data.books : FALLBACK_DATA.books;

        if (data.updated_at) {
          const d = new Date(data.updated_at);
          if (!Number.isNaN(d.getTime())) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, "0");
            const dd = String(d.getDate()).padStart(2, "0");
            document.getElementById("updatedAtText").textContent = ` · 데이터 갱신 ${yyyy}.${mm}.${dd}`;
          }
        }
      } catch (err) {
        booksState = FALLBACK_DATA.books;
      }

      renderShelf(booksState);
    }

    init();
  </script>
</body>
</html>
